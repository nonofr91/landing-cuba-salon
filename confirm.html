<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmation — Un moulin pour Cuba</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function(w,d,t,u,n,a,m){w['MauticTrackingObject']=n;
    w[n]=w[n]||function(){(w[n].q=w[n].q||[]).push(arguments)},a=d.createElement(t),
    m=d.getElementsByTagName(t)[0];a.async=1;a.src=u;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://mautic.cubixmedia.fr/mtc.js','mt');
    mt('send', 'pageview');
  </script>
</head>
<body>
  <main class="page-confirmation">
    <h1>Inscription confirmée</h1>
    <p>Merci ! Votre adresse email est bien confirmée. Vous recevrez désormais les nouvelles du projet <strong>Un moulin pour Cuba</strong>.</p>
    <p><a href="/">Retour à l'accueil</a></p>
  </main>

  <iframe name="mautic-confirm" id="mautic-confirm" style="display:none;" title="Mautic confirmation"></iframe>

  <div style="display:none;">
    <form id="mauticform_confirmationcuba" action="https://mautic.cubixmedia.fr/form/submit?formId=4" method="post" enctype="multipart/form-data" target="mautic-confirm">
      <input type="email" name="mauticform[email]" id="confirm-email" value="" required />
      <input type="hidden" name="mauticform[formId]" value="4" />
      <input type="hidden" name="mauticform[formName]" value="confirmationcuba" />
      <button type="submit" id="confirm-submit">Confirmer</button>
    </form>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const email = params.get('email');
      if (email) {
        const input = document.getElementById('confirm-email');
        input.value = email;
        document.getElementById('confirm-submit').click();
      }
    })();
  </script>
</body>
</html>
