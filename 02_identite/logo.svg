<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Fond rond -->
  <circle cx="200" cy="200" r="190" fill="#FFFEF9" stroke="#0047AB" stroke-width="12"/>

  <!-- Etoile cubaine 5 branches -->
  <g fill="#0047AB">
    <polygon points="200,50 212,145 230,140 216,158 260,180 220,185 235,230 200,195 165,230 180,185 140,180 184,158 170,140 188,145" transform="translate(0,0)"/>
  </g>

  <!-- Meule de moulin au centre -->
  <circle cx="200" cy="200" r="55" fill="none" stroke="#222222" stroke-width="10"/>
  <circle cx="200" cy="200" r="15" fill="#C41E3A"/>

  <!-- Petites feuilles / epis autour -->
  <g fill="#4A7C2A" opacity="0.9">
    <ellipse cx="120" cy="300" rx="18" ry="35" transform="rotate(-30 120 300)"/>
    <ellipse cx="280" cy="300" rx="18" ry="35" transform="rotate(30 280 300)"/>
  </g>
  <g fill="#BFB33B" opacity="0.9">
    <circle cx="100" cy="140" r="12"/>
    <circle cx="300" cy="140" r="12"/>
    <circle cx="320" cy="260" r="10"/>
  </g>

  <!-- Contour interieur subtil -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#BFB33B" stroke-width="4" opacity="0.5"/>
</svg>
